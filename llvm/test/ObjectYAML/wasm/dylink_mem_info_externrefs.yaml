# RUN: yaml2obj %s | obj2yaml | FileCheck %s

# Verify that the WASM_DYLINK_MEM_INFO_EXTERNREFS (type code 0x6) subsection of
# the "dylink.0" section round-trips through yaml2obj and obj2yaml.

--- !WASM
FileHeader:
  Version:         0x00000001

Sections:
  - Type:            CUSTOM
    Name:            dylink.0
    MemorySize:      4
    MemoryAlignment: 2
    TableSize:       1
    TableAlignment:  0
    ExternrefTableSize:      8
    ExternrefTableAlignment: 1
    Needed:          [ libfoo.so ]
...
# CHECK: --- !WASM
# CHECK: FileHeader:
# CHECK:   Version:           0x1
# CHECK: Sections:
# CHECK:   - Type:            CUSTOM
# CHECK:     Name:            dylink.0
# CHECK:     MemorySize:      4
# CHECK:     MemoryAlignment: 2
# CHECK:     TableSize:       1
# CHECK:     TableAlignment:  0
# CHECK:     ExternrefTableSize: 8
# CHECK:     ExternrefTableAlignment: 1
# CHECK:     Needed:
# CHECK:       - libfoo.so
# CHECK: ...
